# Copy to podman/secrets.yaml (git-ignored), fill in, then: podman kube play podman/secrets.yaml podman/todo-pod.yaml
# Keep the real file readable only by you: chmod 600 podman/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
stringData:
  db-password: change-me-to-a-long-random-string   # e.g. openssl rand -base64 24 (avoid characters that need quoting)
  tunnel-token: eyJ-change-me                      # Cloudflare Zero Trust > Networks > Tunnels
  # Optional: Google sign-in. Delete these three lines for username/password only.
  google-client-id: 1234-abc.apps.googleusercontent.com
  google-client-secret: GOCSPX-change-me
  allowed-emails: you@gmail.com                    # comma-separated; empty/absent = any Google account
