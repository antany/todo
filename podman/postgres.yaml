apiVersion: v1
kind: Pod
metadata:
  name: todo-db
spec:
  containers:
    - name: postgres
      image: docker.io/library/postgres:17
      env:
        - { name: POSTGRES_DB, value: todo }
        - { name: POSTGRES_USER, value: todo }
        - { name: POSTGRES_PASSWORD, value: todo }
      ports:
        - containerPort: 5432
          hostPort: 5433
      volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: todo-db-data
